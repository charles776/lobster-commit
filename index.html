<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Lobster Commit</title>
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="apple-touch-icon" href="./assets/logo.png">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Commit">
<meta name="theme-color" content="#080B0F">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;background:#05080C;color:#E8ECF2;min-height:100vh;padding-bottom:140px;overflow-x:hidden}
.header{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 10px;background:rgba(5,8,12,.94);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10;border-bottom:1px solid #1C2532}
.header .header-brand{display:flex;align-items:center;gap:8px}
.header .header-logo{width:28px;height:28px;border-radius:6px;object-fit:contain}
.header .date{font-family:'Cascadia Code','Consolas','SF Mono',monospace;font-size:15px;font-weight:700}
.header .countdown{font-family:'Cascadia Code','Consolas','SF Mono',monospace;font-size:10px;color:#FF9F0A}
.state-badge{padding:3px 10px;font-size:9px;font-family:'Cascadia Code','Consolas','SF Mono',monospace;font-weight:700;letter-spacing:1.5px;border-radius:2px}
.state-locked{background:rgba(255,159,10,.1);color:#FF9F0A;border:1px solid rgba(255,159,10,.2)}
.state-unlocked{background:rgba(48,209,88,.1);color:#30D158;border:1px solid rgba(48,209,88,.2)}
.lock-banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;margin:8px 16px;background:rgba(255,159,10,.06);border:1px solid rgba(255,159,10,.15);border-radius:4px;font-size:11px;font-family:'Cascadia Code','Consolas','SF Mono',monospace;color:#FF9F0A;letter-spacing:1px}
.tab-bar{display:flex;margin:8px 16px;background:#0D1117;border-radius:6px;padding:3px;border:1px solid #1C2532}
.tab-radio{display:none}
.tab-radio:checked+.tab-label{background:#141B24;color:#E8ECF2}
.tab-label{flex:1;text-align:center;padding:8px;font-size:11px;font-weight:600;color:#7A8290;cursor:pointer;border-radius:4px;transition:.15s;font-family:'Cascadia Code','Consolas','SF Mono',monospace;letter-spacing:.5px;display:block}
.tab-panel{display:none;padding:0 16px}
#tr0:checked~#tp0{display:block}
#tr1:checked~#tp1{display:block}
#tr2:checked~#tp2{display:block}

.item{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-bottom:1px solid rgba(28,37,50,.35);font-size:12px;transition:all .15s;border-radius:2px;margin-bottom:1px}
.item.critical{border-left:3px solid #FF3B30;padding-left:6px}
.item.executed{opacity:.45}
.item.executed .item-head{text-decoration:line-through}
.item.overridden{opacity:.55;background:rgba(255,59,48,.02)}
.item-left{flex-shrink:0;min-width:40px}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:2px;font-family:'Cascadia Code','Consolas','SF Mono',monospace;letter-spacing:.5px}
.badge-sell{background:rgba(255,59,48,.15);color:#FF3B30}
.badge-reduce{background:rgba(255,159,10,.12);color:#FF9F0A}
.badge-hold{background:rgba(48,209,88,.1);color:#30D158}
.badge-buy{background:rgba(10,132,255,.12);color:#0A84FF}
.item-main{flex:1;min-width:0}
.item-head{font-size:12px;font-weight:500;margin-bottom:2px}
.item-head .code{font-family:'Cascadia Code','Consolas','SF Mono',monospace;font-size:11px;color:#0A84FF}
.item-head .name{font-size:12px}
.item-meta{font-size:10px;color:#7A8290;line-height:1.4}
.exec-btn-placeholder{font-size:9px;font-weight:700;padding:3px 8px;border:1px solid #30D158;border-radius:3px;color:#30D158;cursor:pointer;font-family:'Cascadia Code','Consolas','SF Mono',monospace;background:rgba(48,209,88,.08);transition:all .15s}
.exec-btn-placeholder:active{background:rgba(48,209,88,.2)}
.conn-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.conn-on{background:#30D158}.conn-off{background:#FF3B30}
.override-link{font-size:9px;color:#485268;cursor:pointer;padding:2px 6px;border:1px solid transparent;font-family:'Cascadia Code','Consolas','SF Mono',monospace;flex-shrink:0;border-radius:2px}
.override-link:hover{color:#FF3B30;border-color:rgba(255,59,48,.3)}

.buy-item{padding:12px 10px;border-bottom:1px solid rgba(28,37,50,.3);background:#0D1117;border-radius:4px;margin-bottom:4px}
.buy-item .bw-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:4px}
.buy-item .code{font-family:'Cascadia Code','Consolas','SF Mono',monospace;font-weight:700;color:#E8ECF2}
.buy-item .eta{font-family:'Cascadia Code','Consolas','SF Mono',monospace;font-size:10px;font-weight:700;color:#FF9F0A}
.buy-item .trigger{font-size:10px;color:#7A8290;line-height:1.5}
.buy-item .bw-notes{font-size:9px;color:#485268;line-height:1.4;margin-top:3px}
.buy-item .bw-priority{display:inline-block;font-size:8px;padding:1px 6px;border-radius:2px;font-family:'Cascadia Code','Consolas','SF Mono',monospace}
.p0-tag{background:rgba(255,59,48,.1);color:#FF3B30}
.p1-tag{background:rgba(255,159,10,.1);color:#FF9F0A}
.p2-tag{background:rgba(10,132,255,.1);color:#0A84FF}

.stats-row{display:flex;gap:8px;margin-bottom:12px}
.stat-card{flex:1;text-align:center;padding:14px 8px;background:#0D1117;border:1px solid #1C2532;border-radius:4px}
.stat-card .v{font-family:'Cascadia Code','Consolas','SF Mono',monospace;font-size:26px;font-weight:700}
.stat-card .l{font-size:9px;color:#7A8290;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;font-family:'Cascadia Code','Consolas','SF Mono',monospace}
.section-title{font-size:10px;font-weight:700;color:#7A8290;text-transform:uppercase;letter-spacing:1px;font-family:'Cascadia Code','Consolas','SF Mono',monospace;margin-bottom:8px;padding:8px 0 0 0}
.log-line{font-size:9px;color:#7A8290;padding:2px 0;font-family:'Cascadia Code','Consolas','SF Mono',monospace;border-bottom:1px solid rgba(28,37,50,.2)}
.log-time{color:#485268;margin-right:4px}

.empty-state{text-align:center;padding:24px;color:#485268;font-size:11px;font-family:'Cascadia Code','Consolas','SF Mono',monospace}
.loading{text-align:center;padding:12px;color:#485268;font-size:10px}

.meta-line{display:flex;justify-content:space-between;font-size:9px;color:#485268;font-family:'Cascadia Code','Consolas','SF Mono',monospace;padding:4px 16px}

.float-lock{position:fixed;bottom:20px;left:16px;right:16px;z-index:100}
.lock-btn{position:relative;display:block;width:100%;padding:16px;font-size:15px;font-weight:700;cursor:pointer;border:2px solid #FF9F0A;background:rgba(5,8,12,.96);color:#FF9F0A;letter-spacing:2px;font-family:'Cascadia Code','Consolas','SF Mono',monospace;text-transform:uppercase;border-radius:6px;text-align:center;backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(255,159,10,.08);overflow:hidden}
.lock-btn:active{transform:scale(.96)}
.lock-btn .progress{position:absolute;bottom:0;left:0;height:4px;background:rgba(255,159,10,.8);width:0%}
.lock-btn .sub{font-size:9px;opacity:.5;display:block;margin-top:4px;letter-spacing:1px;font-weight:400;position:relative;z-index:1}
.lock-btn.locked{border-color:#485268;color:#485268;box-shadow:none;pointer-events:none}
@keyframes lock-pulse{0%,100%{box-shadow:0 0 24px rgba(255,159,10,.06)}50%{box-shadow:0 0 48px rgba(255,159,10,.15)}}
.lock-btn:not(.locked){animation:lock-pulse 3s ease-in-out infinite}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#FF9F0A;color:#05080C;padding:10px 24px;border-radius:20px;font-weight:700;font-family:'Cascadia Code','Consolas','SF Mono',monospace;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style></head>
<body onload="init()">
<div class="header">
    <div class="header-brand"><img class="header-logo" src="./assets/logo.png" alt="L"><div><div class="date" id="dateLine">---</div><div class="countdown" id="countdown">加载中...</div></div></div>
    <div class="state-badge state-locked" id="stateBadge">---</div>
</div>

<div id="connStatus" style="text-align:center;padding:4px;font-size:9px;font-family:'Cascadia Code','Consolas','SF Mono',monospace"></div>
<div class="meta-line"><span id="fundLine">---</span><span id="botLine">---</span></div>

<div style="text-align:center;padding:4px;font-size:8px;font-family:monospace"><span id="verTag" style="color:#485268">v?</span> · <a href="javascript:navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));caches.keys().then(k=>k.forEach(x=>caches.delete(x)));location.reload();" style="color:#FF3B30;text-decoration:none">硬核重置</a></div>

<input type="radio" class="tab-radio" name="tab" id="tr0" checked>
<input type="radio" class="tab-radio" name="tab" id="tr1">
<input type="radio" class="tab-radio" name="tab" id="tr2">
<div class="tab-bar">
    <label class="tab-label" for="tr0">📋 计划</label>
    <label class="tab-label" for="tr1"><span id="bwCount">🎯 候选</span></label>
    <label class="tab-label" for="tr2">📊 状态</label>
</div>

<div class="tab-panel" id="tp0">
    <div id="planList"><div class="loading">加载中...</div></div>
</div>
<div class="tab-panel" id="tp1">
    <div class="section-title" style="padding-left:0">BUY WATCH · 舒服买点候选</div>
    <div id="buyWatchList"><div class="loading">加载中...</div></div>
</div>
<div class="tab-panel" id="tp2">
    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="v" id="statStreak" style="color:#30D158">-</div><div class="l">连续遵守</div></div>
        <div class="stat-card"><div class="v" id="statOverride" style="color:#FF3B30">-</div><div class="l">本月覆盖</div></div>
        <div class="stat-card"><div class="v" id="statCandidates" style="color:#0A84FF">-</div><div class="l">候选</div></div>
    </div>
    <div class="section-title">操作日志</div>
    <div id="logList"><div class="loading">加载中...</div></div>
</div>

<div class="float-lock">
    <div class="lock-btn locked" id="lockBtn"
         ontouchstart="startHold()" ontouchend="cancelHold()" ontouchmove="cancelHold()"
         onmousedown="startHold()" onmouseup="cancelHold()" onmouseleave="cancelHold()">
        <span style="position:relative;z-index:1">🔒 已封印</span>
        <div class="sub" style="position:relative;z-index:1">盘中照此执行</div>
        <div class="progress" id="lockProgress"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API = '';
var API_CANDIDATES = ['http://192.168.1.4:8766','http://192.168.43.100:8766','http://192.168.43.101:8766','http://172.20.10.2:8766','http://172.20.10.3:8766','http://127.0.0.1:8766'];
var locked = true;
var localState = {};
try { localState = JSON.parse(localStorage.getItem('commit_state') || '{"locked":false,"executed":[],"overridden":[]}'); } catch(e) {};
if (localState.locked) locked = true;

function saveState() { localStorage.setItem('commit_state', JSON.stringify(localState)); }
function isExecuted(id) { return localState.executed.indexOf(id) !== -1; }
function isOverridden(id) { return localState.overridden.indexOf(id) !== -1; }

// API discovery
async function tryApi(url) {
    try { var r = await fetch(url + '/api/state'); if (r.ok) return url; } catch(e) {}
    return null;
}
async function discoverApi() {
    if (API) { var ok = await tryApi(API); if (ok) return; }
    var lastApi = localStorage.getItem('last_api');
    if (lastApi) { var ok = await tryApi(lastApi); if (ok) { API = ok; return; } }
    for (var i = 0; i < API_CANDIDATES.length; i++) {
        var ok = await tryApi(API_CANDIDATES[i]);
        if (ok) { API = ok; localStorage.setItem('last_api', API); return; }
    }
}

async function apiGet(path) {
    if (!API) return null;
    try { var r = await fetch(API + path); return r.json(); } catch(e) { return null; }
}
async function apiPost(path, body) {
    if (!API) return null;
    try { var r = await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); return r.json(); } catch(e) { return null; }
}

// Load plan items
async function loadPlan() {
    var data = await apiGet('/api/plan');
    if (!data || !data.items) { document.getElementById('planList').innerHTML = '<div class="empty-state">离线 · 无法加载计划</div>'; return; }
    locked = data.locked || false;
    var html = '';
    for (var i = 0; i < data.items.length; i++) {
        var item = data.items[i];
        var cls = 'item';
        if (item.critical) cls += ' critical';
        if (isExecuted(item.id)) cls += ' executed';
        if (isOverridden(item.id)) cls += ' overridden';
        var badgeCls = 'badge-hold';
        var act = item.action || '';
        if (act.indexOf('卖')>=0 || act.indexOf('清')>=0) badgeCls = 'badge-sell';
        else if (act.indexOf('减')>=0) badgeCls = 'badge-reduce';
        else if (act.indexOf('买')>=0) badgeCls = 'badge-buy';
        html += '<div class="'+cls+'" data-id="'+item.id+'">';
        html += '<div class="item-left"><span class="badge '+badgeCls+'">'+(act||'持有')+'</span></div>';
        html += '<div class="item-main"><div class="item-head"><span class="code">'+(item.code||'')+'</span> <span class="name">'+(item.name||'')+'</span>';
        if (!isExecuted(item.id)) html += ' <span class="exec-btn-placeholder" onclick="execItem('+item.id+')">执行</span>';
        html += '</div><div class="item-meta">'+(item.reason||'')+'</div></div>';
        html += '</div>';
    }
    document.getElementById('planList').innerHTML = html || '<div class="empty-state">暂无计划项</div>';
    updateLockUI();
}

// Load BUY WATCH
async function loadBuyWatch() {
    var data = await apiGet('/api/buywatch');
    if (!data || !data.items) { document.getElementById('buyWatchList').innerHTML = '<div class="empty-state">离线 · 无法加载候选</div>'; return; }
    var html = '';
    for (var i = 0; i < data.items.length; i++) {
        var bw = data.items[i];
        var pTag = bw.priority === 0 ? 'p0-tag' : (bw.priority === 1 ? 'p1-tag' : 'p2-tag');
        html += '<div class="buy-item">';
        html += '<div class="bw-top"><span><span class="code">'+bw.code+'</span> '+bw.name+' <span class="bw-priority '+pTag+'">P'+bw.priority+'</span></span><span class="eta">'+bw.eta+'</span></div>';
        html += '<div class="trigger">'+bw.trigger_cond+'</div>';
        if (bw.notes) html += '<div class="bw-notes">'+bw.notes+'</div>';
        html += '</div>';
    }
    document.getElementById('buyWatchList').innerHTML = html || '<div class="empty-state">暂无候选</div>';
    document.getElementById('bwCount').textContent = '🎯 候选('+data.items.length+')';
    document.getElementById('statCandidates').textContent = data.items.length;
}

// Load logs
async function loadLogs() {
    var data = await apiGet('/api/logs');
    if (!data || !data.logs) { document.getElementById('logList').innerHTML = '<div class="empty-state">无日志</div>'; return; }
    var html = '';
    for (var i = Math.max(0, data.logs.length - 20); i < data.logs.length; i++) {
        var log = data.logs[i];
        html += '<div class="log-line"><span class="log-time">'+log.time+'</span>'+log.text+'</div>';
    }
    document.getElementById('logList').innerHTML = html || '<div class="empty-state">无日志</div>';
}

// Lock UI
function updateLockUI() {
    var badge = document.getElementById('stateBadge');
    var btn = document.getElementById('lockBtn');
    if (locked) {
        badge.textContent = 'LOCKED 🔒'; badge.className = 'state-badge state-locked';
        btn.className = 'lock-btn locked';
        btn.innerHTML = '<span style="position:relative;z-index:1">🔒 已封印</span><div class="sub" style="position:relative;z-index:1">盘中照此执行</div><div class="progress"></div>';
    } else {
        badge.textContent = 'UNLOCKED'; badge.className = 'state-badge state-unlocked';
        btn.className = 'lock-btn';
        btn.innerHTML = '<span style="position:relative;z-index:1">长按封印</span><div class="sub" style="position:relative;z-index:1">3秒确认</div><div class="progress" id="lockProgress"></div>';
    }
}

// Execute item
async function execItem(id) {
    if (!locked) { showToast('请先封印计划'); return; }
    if (isExecuted(id)) return;
    if (navigator.vibrate) navigator.vibrate(50);
    localState.executed.push(id); saveState();
    var item = document.querySelector('.item[data-id="' + id + '"]');
    if (item) { item.classList.add('executed'); var b = item.querySelector('.exec-btn-placeholder'); if (b) b.style.display = 'none'; }
    showToast('✓ 已执行');
    apiPost('/api/plan/execute', {id: id});
    // Reload plan to sync
    setTimeout(loadPlan, 1000);
}

// Lock
var holdTimer = null;
function startHold() {
    if (locked) return;
    var start = Date.now();
    var bar = document.getElementById('lockProgress');
    holdTimer = setInterval(function() {
        var pct = Math.min(100, (Date.now() - start) / 30);
        bar.style.width = pct + '%';
        if (pct >= 100) { cancelHold(); triggerLock(); }
    }, 50);
}
function cancelHold() { clearInterval(holdTimer); holdTimer = null; var bar = document.getElementById('lockProgress'); if (bar) bar.style.width = '0%'; }
async function triggerLock() {
    cancelHold();
    if (navigator.vibrate) navigator.vibrate([30,50,30,50,100]);
    showToast('🔒 计划已封印');
    locked = true; localState.locked = true; saveState();
    updateLockUI();
    apiPost('/api/plan/lock', {});
}

// Countdown
function updateCountdown() {
    var now = new Date();
    var d = now.getDay();
    document.getElementById('dateLine').textContent = now.toISOString().slice(0,10) + ' · 周' + ['日','一','二','三','四','五','六'][d];
    if (d === 0 || d === 6) {
        document.getElementById('countdown').textContent = '周末休市';
    } else {
        var mo = new Date(now); mo.setHours(9,30,0,0);
        if (now > new Date(now).setHours(15,0,0,0)) {
            document.getElementById('countdown').textContent = '已收盘';
        } else if (now > mo) {
            document.getElementById('countdown').textContent = '交易中';
        } else {
            var secs = Math.max(0, Math.floor((mo - now) / 1000));
            var h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
            document.getElementById('countdown').textContent = '距开盘 ' + h + '时' + m + '分';
        }
    }
}

// Utility
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

// Init
async function init() {
    await discoverApi();
    updateCountdown(); setInterval(updateCountdown, 60000);

    // Load all data
    await Promise.all([loadPlan(), loadBuyWatch(), loadLogs()]);

    // Connection status
    var el = document.getElementById('connStatus');
    if (API) {
        el.innerHTML = '<span class="conn-dot conn-on"></span>已连接 · ' + API.replace('http://','').replace(':8766','');
        // Load fund/bot meta
        var plan = await apiGet('/api/plan');
        if (plan) {
            var lines = (plan.content||'').split('\n');
            var fundLine = '', botLine = '';
            for (var i = 0; i < lines.length; i++) {
                if (lines[i].indexOf('总资产')>=0 || lines[i].indexOf('资金')>=0) fundLine = lines[i].replace(/\*/g,'').trim().slice(0,50);
                if (lines[i].indexOf('V12')>=0) botLine = lines[i].replace(/\*/g,'').trim().slice(0,50);
            }
            document.getElementById('fundLine').textContent = fundLine || '---';
            document.getElementById('botLine').textContent = botLine || '---';
        }
    } else {
        el.innerHTML = '<span class="conn-dot conn-off"></span>离线 · 使用缓存';
    }
    setInterval(async function() {
        if (!API) { await discoverApi(); if (API) init(); }
    }, 30000);

    // Refresh data every 2 minutes
    setInterval(function() { loadPlan(); loadBuyWatch(); loadLogs(); }, 120000);
}

document.getElementById('verTag').textContent = 'v12';
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js?t=12'); }
</script>
</body></html>
